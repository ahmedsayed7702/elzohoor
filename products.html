<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>El-Zohor - Products</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">
        <img src="PSD2.PNG" alt="El-Zohor Logo" style="height:70px;max-width:320px;">
      </div>
      <div class="nav-links">
        <select id="lang-select" style="padding:0.3rem 1rem;border-radius:20px;font-weight:600;background:#f7c948;color:#181818;border:none;outline:none;cursor:pointer;">
          <option value="en">English</option>
          <option value="ar">العربية</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="zh">中文</option>
        </select>
        <a href="index.html" data-i18n="home">Home</a>
        <a href="products.html" data-i18n="products">Products</a>
        <a href="contact.html" data-i18n="contact">Contact Us</a>
      </div>
    </nav>
  </header>
  <main>
    <div class="product-buttons" data-aos="fade-down" data-aos-delay="200">
      <button onclick="showCategory('import')" data-category="import" data-i18n="import">Import Products</button>
      <button onclick="showCategory('export')" data-category="export" data-i18n="export">Export Products</button>
    </div>
    <div id="product-container" data-aos="fade-up" data-aos-delay="400"></div>
    <!-- تم حذف أدوات الترجمة الخاصة بالمنتجات -->
  </main>
  <script src="products.js"></script>
  <script src="lang.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script>
    AOS.init({ duration: 900, once: true });
    // لغة محفوظة
    const langSelect = document.getElementById('lang-select');
    if (localStorage.getItem('lang')) {
      langSelect.value = localStorage.getItem('lang');
    }
    langSelect.onchange = function() {
      setLang(this.value);
    };
  </script>
</body>
</html>
